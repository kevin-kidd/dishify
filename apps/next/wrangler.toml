name = "dishify"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
assets = { directory = ".open-next/assets", binding = "ASSETS" }

[[kv_namespaces]]
binding = "NEXT_CACHE_WORKERS_KV"
id = "81584d35b7a146cab34cdd01d354f8dd"

[observability.logs]
enabled = true

[vars]
NEXT_PUBLIC_API_URL="https://api.dishify.app"
NEXT_PUBLIC_APP_URL="https://dishify.app"
NEXT_PUBLIC_AUTH_BASE_URL="https://api.dishify.app"
NEXT_PUBLIC_SUPPORT_EMAIL="contact@dishify.app"
NEXT_PUBLIC_METADATA_NAME="Dishify"
NEXT_PUBLIC_METADATA_DESCRIPTION="Dishify: Your AI-powered culinary companion. Enter any dish name for instant recipes, ingredient lists, and smart shopping links. Elevate your cooking with personalized instructions and effortless grocery planning."
NEXT_PUBLIC_SENTRY_ORG="dishify"